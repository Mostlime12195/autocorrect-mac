name: build
on:
  push:
    branches: [main]
    tags: ['mac-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # macos-14 is "not supported" for this account
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers && sysctl -n machdep.cpu.brand_string
      - uses: actions/cache@v4
        with:
          path: vendor/onnxruntime
          key: ort-1.31.1-osx-arm64
      - run: scripts/fetch_ort.sh
      - uses: actions/cache@v4
        with:
          path: models
          key: models-hf-v1
      - name: Models for the parity tests
        run: scripts/fetch_models.sh models
      - name: Unit and parity tests
        env:
          AC_MODEL_DIR: ${{ github.workspace }}/models
          AC_REQUIRE_MODELS: '1'
        run: swift test -c release -Xswiftc -enable-testing 2>&1 | tee test.log
      - name: Parity summary
        if: always()
        run: grep -E "identical|cases|slots|corrector vs|onnxruntime|Executed|error:|failed" test.log | grep -v "^  " | head -40 || true
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then echo "VERSION=${GITHUB_REF#refs/tags/mac-v}" >> "$GITHUB_ENV"
          else echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"; fi
      - name: Signing identity
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no signing secret (fork PR): ad-hoc build"; exit 0; fi
          KC="$RUNNER_TEMP/keylime.keychain-db"
          KPW=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/k.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$RUNNER_TEMP/k.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/k.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          SHA=$(security find-certificate -c "Keylime Self-Signed" -Z "$KC" | awk '/SHA-1/ {print $NF}')
          echo "SIGN_IDENTITY=$SHA" >> "$GITHUB_ENV"
      - name: Build app
        run: scripts/build_app.sh "$VERSION" "${{ github.run_number }}"
      - name: Designated requirement is the certificate, not a cdhash
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign -d -r- dist/Keylime.app 2>&1 | tee dr.txt
          grep -q 'designated => identifier "dev.mostlime.autocorrect-mac" and certificate leaf = H"' dr.txt
          ! grep -q cdhash dr.txt
          codesign -dvv dist/Keylime.app 2>&1 | grep -E "Authority|Identifier|TeamIdentifier"
      - name: Self-test the bundled app
        env:
          KL_REQUIRE_SIGNED: ${{ env.SIGN_IDENTITY != '' && '1' || '0' }}
        run: dist/Keylime.app/Contents/MacOS/Keylime --selftest models
      - uses: actions/upload-artifact@v4
        with:
          name: Keylime-mac-${{ env.VERSION }}
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Keylime-mac-$VERSION.zip --title "Keylime for Mac $VERSION" \
            --notes "Self-signed, not notarized: see the README for first launch." || \
          gh release upload "$GITHUB_REF_NAME" dist/Keylime-mac-$VERSION.zip --clobber
