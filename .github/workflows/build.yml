name: build
on:
  push:
    branches: [main]
    tags: ['mac-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # macos-14 is "not supported" for this account
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers && sysctl -n machdep.cpu.brand_string
      - uses: actions/cache@v4
        with:
          path: vendor/onnxruntime
          key: ort-1.31.1-osx-arm64
      - run: scripts/fetch_ort.sh
      - uses: actions/cache@v4
        with:
          path: models
          key: models-hf-v1
      - name: Models for the parity tests
        run: scripts/fetch_models.sh models
      - name: Unit and parity tests
        env:
          AC_MODEL_DIR: ${{ github.workspace }}/models
          AC_REQUIRE_MODELS: '1'
        run: swift test -c release -Xswiftc -enable-testing 2>&1 | tee test.log
      - name: Parity summary
        if: always()
        run: grep -E "identical|cases|slots|corrector vs|onnxruntime|Executed|error:|failed" test.log | grep -v "^  " | head -40 || true
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then echo "VERSION=${GITHUB_REF#refs/tags/mac-v}" >> "$GITHUB_ENV"
          else echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"; fi
      - name: Signing identity
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no signing secret (fork PR): ad-hoc build"; exit 0; fi
          KC="$RUNNER_TEMP/keylime.keychain-db"
          KPW=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/k.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$RUNNER_TEMP/k.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/k.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          SHA=$(security find-certificate -c "Keylime Self-Signed" -Z "$KC" | awk '/SHA-1/ {print $NF}')
          echo "SIGN_IDENTITY=$SHA" >> "$GITHUB_ENV"
      - name: Build app
        run: scripts/build_app.sh "$VERSION" "${{ github.run_number }}"
      - name: Designated requirement is the certificate, not a cdhash
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign -d -r- dist/Keylime.app 2>&1 | tee dr.txt
          grep -q 'designated => identifier "dev.mostlime.autocorrect-mac" and certificate leaf = H"' dr.txt
          ! grep -q cdhash dr.txt
          codesign -dvv dist/Keylime.app 2>&1 | grep -E "Authority|Identifier|TeamIdentifier"
      - name: Self-test the bundled app
        env:
          KL_REQUIRE_SIGNED: ${{ env.SIGN_IDENTITY != '' && '1' || '0' }}
        run: dist/Keylime.app/Contents/MacOS/Keylime --selftest models
      - name: Memory of one big candidate batch vs chunks (fresh process each)
        run: |
          for r in 100000 32 8; do dist/Keylime.app/Contents/MacOS/Keylime --rsstest models $r | grep RSSTEST; done
      - uses: actions/upload-artifact@v4
        with:
          name: Keylime-mac-${{ env.VERSION }}
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Keylime-mac-$VERSION.zip --title "Keylime for Mac $VERSION" \
            --notes "Self-signed, not notarized: see the README for first launch." || \
          gh release upload "$GITHUB_REF_NAME" dist/Keylime-mac-$VERSION.zip --clobber

  # Experimental, manual runs only, never blocks: the built app against a real text field, counting fixes. Needs
  # Accessibility for Keylime on the runner (inherited from the runner's own grant, or inserted into TCC.db).
  e2e:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Keylime-mac-*
          merge-multiple: true
          path: dist
      - name: Environment
        run: |
          sw_vers; csrutil status || true
          cd dist && ditto -x -k Keylime-mac-*.zip . && ls
      - name: Build the target
        run: swiftc -O scripts/e2e/typing_target.swift -o "$RUNNER_TEMP/typing_target"
      - name: Grant Accessibility (TCC.db; needs SIP off)
        run: |
          APP="$PWD/dist/Keylime.app/Contents/MacOS/Keylime"
          for c in "$APP" "$RUNNER_TEMP/typing_target"; do
            for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
              for s in kTCCServiceAccessibility kTCCServiceListenEvent kTCCServicePostEvent; do
                sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,flags) VALUES ('$s','$c',1,2,4,1,0);" \
                  && echo "granted $s $c in $db" || echo "FAILED $s $c in $db"
              done
            done
          done
      - name: Start Keylime (auto mode) and wait for the model
        run: |
          D=dev.mostlime.autocorrect-mac
          defaults write $D mode auto
          defaults write $D askedSystemAutocorrect -bool true
          defaults write -g NSAutomaticSpellingCorrectionEnabled -bool false
          dist/Keylime.app/Contents/MacOS/Keylime > "$RUNNER_TEMP/keylime.log" 2>&1 &
          M="$HOME/Library/Application Support/Autocorrect/models"
          for i in $(seq 1 120); do
            n=$(ls -a "$M" 2>/dev/null | grep -c '\.sha256$' || true)
            if [ "$n" -ge 2 ]; then echo "model installed after ${i}s"; break; fi
            sleep 1
          done
          ls -la "$M" || true
          sleep 15
          pgrep -fl Keylime || { echo "Keylime died"; cat "$RUNNER_TEMP/keylime.log"; exit 1; }
      - name: Type into an NSTextView
        run: |
          "$RUNNER_TEMP/typing_target" 80 | tee e2e.log
          "$RUNNER_TEMP/typing_target" 30 | tee -a e2e.log
      - name: Type into an Electron textarea
        run: |
          cd scripts/e2e/electron
          npx --yes electron@33.2.1 . 2>&1 | grep -v -i "cache\|gpu" | tee "$RUNNER_TEMP/electron.log" &
          for i in $(seq 1 120); do grep -q "ready" "$RUNNER_TEMP/electron.log" 2>/dev/null && break; sleep 1; done
          sleep 2
          "$RUNNER_TEMP/typing_target" 60 --post-only
          for i in $(seq 1 60); do grep -q "E2E RESULT" "$RUNNER_TEMP/electron.log" && break; sleep 2; done
          cat "$RUNNER_TEMP/electron.log"
      - name: Keylime log
        if: always()
        run: |
          cat "$RUNNER_TEMP/keylime.log" || true
          log show --last 5m --predicate 'subsystem == "dev.mostlime.autocorrect-mac"' --style compact 2>/dev/null | tail -100 || true
